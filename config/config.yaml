app:
  name: "Enterprise RAG Pipeline"
  env: "production"
  log_level: "INFO"

qdrant:
  host: "qdrant"
  port: 6333
  collection_name: "enterprise_docs_v1"
  vector_size: 1536
  distance: "Cosine"

cohere:
  model: "rerank-english-v3.0"
  top_n: 5

mlflow:
  tracking_uri: "http://mlflow:5000"
  experiment_name: "enterprise_rag_eval"

chunking:
  chunk_size: 512
  chunk_overlap: 64
  strategy: "dynamic_semantic"